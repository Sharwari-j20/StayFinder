<body class="bg-light">


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold fs-3"
            href="index.html">

            <span class="brand-mark">S</span>

            StayFinder

        <div>

            <a
                href="index.html"
                class="btn btn-outline-dark me-2">

                Home

            </a>


            <a

                class="btn btn-dark">

                Find Hotels

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     PROFILE SECTION
     ===================================================== -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <!-- PAGE TITLE -->

            <div class="text-center mb-5">

                <span class="section-label">
                    MY ACCOUNT
                </span>

                <h1 class="section-title mt-2">
                    Your Profile
                </h1>

                <p class="text-secondary">
                    Save your details for a smoother booking
                    experience.
                </p>

            </div>



            <!-- PROFILE CARD -->

            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">


                <!-- PROFILE AVATAR -->

                <div class="text-center mb-4">

                    <div class="profile-avatar mx-auto">

                        S

                    </div>

                    <h4 class="mt-3 mb-1">
                        StayFinder Guest
                    </h4>

                    <p class="text-secondary">
                        Hotel Traveller
                    </p>

                </div>



                <!-- PROFILE FORM -->

                <form id="profileForm">


                    <div class="mb-3">

                        <label
                            for="profileName"
                            class="form-label fw-semibold">

                            Full Name

                        </label>


                        <input
                            type="text"
                            id="profileName"
                            class="form-control"
                            placeholder="Enter your name"
                            required>

                    </div>



                    <div class="mb-3">

                        <label
                            for="profileEmail"
                            class="form-label fw-semibold">

                            Email Address

                        </label>


                        <input
                            type="email"
                            id="profileEmail"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>



                    <div class="mb-3">

                        <label
                            for="profilePhone"
                            class="form-label fw-semibold">

                            Phone Number

                        </label>


                        <input
                            type="tel"
                            id="profilePhone"
                            class="form-control"
                            placeholder="Enter your phone number">

                    </div>



                    <div class="mb-4">

                        <label
                            for="profileCity"
                            class="form-label fw-semibold">

                            City

                        </label>


                        <input
                            type="text"
                            id="profileCity"
                            class="form-control"
                            placeholder="Enter your city">

                    </div>



                    <!-- SAVE BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-dark btn-lg w-100">

                        Save Profile

                    </button>


                </form>


                <!-- SUCCESS MESSAGE -->

                <div
                    id="profileMessage"
                    class="alert alert-success
                           border-0 rounded-3 mt-4 d-none">

                    ✓ Profile saved successfully!

                </div>


            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer class="footer mt-5">

    <div class="container">

        <div class="row">

            <div class="col-md-6">

                <h4>

                    <span class="brand-mark">S</span>

                    StayFinder

                <p>
                    Find beautiful stays and make every trip
                    memorable.
                </p>

            </div>


            <div class="col-md-6 text-md-end">

                <p>
                    © 2026 StayFinder
                </p>

                <p>
                    Hotel Booking Demo Website
                </p>

            </div>

        </div>

    </div>

</footer>



<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Main JavaScript -->

<script src="script.js"></script>



<script>

/* =====================================================
   LOAD SAVED PROFILE
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const savedProfile =
            JSON.parse(
                localStorage.getItem(
                    "stayfinderProfile"
                )
            );


        if (savedProfile) {

            document.getElementById(
                "profileName"
            ).value =
                savedProfile.name || "";


            document.getElementById(
                "profileEmail"
            ).value =
                savedProfile.email || "";


            document.getElementById(
                "profilePhone"
            ).value =
                savedProfile.phone || "";


            document.getElementById(
                "profileCity"
            ).value =
                savedProfile.city || "";

        }


        /* Track profile page */

        trackEvent(
            "profile_page_view"
        );

    }
);



/* =====================================================
   SAVE PROFILE
   ===================================================== */

document
    .getElementById("profileForm")
    .addEventListener(
        "submit",
        function (event) {

            event.preventDefault();


            const profile = {

                name:
                    document.getElementById(
                        "profileName"
                    ).value,

                email:
                    document.getElementById(
                        "profileEmail"
                    ).value,

                phone:
                    document.getElementById(
                        "profilePhone"
                    ).value,

                city:
                    document.getElementById(
                        "profileCity"
                    ).value

            };


            /* Save profile */

            localStorage.setItem(
                "stayfinderProfile",
                JSON.stringify(profile)
            );


            /* Show success message */

            const message =
                document.getElementById(
                    "profileMessage"
                );

            message.classList.remove(
                "d-none"
            );


            /* Google Analytics event */

            trackEvent(
                "profile_saved",
                {
                    profile_city:
                        profile.city
                }
            );


            /* Hide message after 3 seconds */

            setTimeout(
                function () {

                    message.classList.add(
                        "d-none"
                    );

                },
                3000
            );

        }
    );

</script>


</body>

</html>
