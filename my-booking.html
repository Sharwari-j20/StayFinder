<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StayFinder | My Booking</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7BK6CVH2B3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-7BK6CVH2B3');
</script>
<!-- End Google Analytics -->

</head>


<body class="bg-light">


<!-- =====================================================
     NAVBAR
     ===================================================== -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold fs-3"
            href="index.html">

            <span class="brand-mark">S</span>

            StayFinder

        </a>


        <div>

            <a
                href="index.html"
                class="btn btn-outline-dark me-2">

                Home

            </a>


            <a
                href="hotels.html"
                class="btn btn-dark">

                Find Hotels

            </a>

        </div>

    </div>

</nav>



<!-- =====================================================
     PAGE CONTENT
     ===================================================== -->

<div class="container py-5">


    <!-- PAGE TITLE -->

    <div class="text-center mb-5">

        <span class="section-label">
            YOUR STAY
        </span>

        <h1 class="section-title mt-2">
            My Booking
        </h1>

        <p class="text-secondary">
            View your StayFinder reservation details below.
        </p>

    </div>



    <!-- BOOKING WILL APPEAR HERE -->

    <div id="bookingContainer"></div>


</div>



<!-- =====================================================
     FOOTER
     ===================================================== -->

<footer class="footer mt-5">

    <div class="container">

        <div class="row">

            <div class="col-md-6">

                <h4>
                    <span class="brand-mark">S</span>
                    StayFinder
                </h4>

                <p>
                    Find beautiful stays and make every trip
                    memorable.
                </p>

            </div>


            <div class="col-md-6 text-md-end">

                <p>
                    © 2026 StayFinder
                </p>

                <p>
                    Hotel Booking Demo Website
                </p>

            </div>

        </div>

    </div>

</footer>



<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Main JavaScript -->

<script src="script.js"></script>



<script>

/* =====================================================
   LOAD BOOKING
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const container =
            document.getElementById(
                "bookingContainer"
            );


        const booking =
            JSON.parse(
                localStorage.getItem("booking")
            );


        /* ---------------------------------------------
           NO BOOKING
           --------------------------------------------- */

        if (!booking) {

            container.innerHTML = `

                <div class="empty-state text-center">

                    <div class="display-3 mb-3">
                        🏨
                    </div>

                    <h2>
                        No booking found
                    </h2>

                    <p class="text-secondary">
                        You haven't made a booking yet.
                    </p>

                    <a
                        href="hotels.html"
                        class="btn btn-dark mt-3">

                        Explore Hotels

                    </a>

                </div>

            `;

            trackEvent(
                "no_booking_view"
            );

            return;
        }



        /* ---------------------------------------------
           BOOKING EXISTS
           --------------------------------------------- */

        container.innerHTML = `

            <div class="row justify-content-center">

                <div class="col-lg-10">


                    <!-- SUCCESS MESSAGE -->

                    <div
                        class="alert alert-success
                               border-0 rounded-4
                               text-center mb-4">

                        <h4 class="mb-1">
                            🎉 Booking Confirmed!
                        </h4>

                        <p class="mb-0">
                            Your hotel reservation has been
                            successfully saved.
                        </p>

                    </div>



                    <!-- BOOKING CARD -->

                    <div
                        class="card border-0
                               shadow-sm rounded-4
                               overflow-hidden">


                        <div class="row g-0">


                            <!-- HOTEL IMAGE -->

                            <div class="col-md-5">

                                <img
                                    src="${booking.image}"
                                    alt="${booking.hotel}"
                                    class="w-100 h-100"
                                    style="
                                        min-height:350px;
                                        object-fit:cover;
                                    ">

                            </div>



                            <!-- BOOKING DETAILS -->

                            <div class="col-md-7">

                                <div class="card-body p-4 p-lg-5">


                                    <span
                                        class="badge
                                               bg-success mb-3">

                                        CONFIRMED

                                    </span>


                                    <h2>
                                        ${booking.hotel}
                                    </h2>


                                    <p class="text-secondary">

                                        📍 ${booking.location}

                                    </p>



                                    <hr>



                                    <!-- BOOKING ID -->

                                    <div class="mb-3">

                                        <small
                                            class="text-secondary">

                                            Booking ID

                                        </small>

                                        <h6>
                                            STF${Date.now()
                                                .toString()
                                                .slice(-8)}
                                        </h6>

                                    </div>



                                    <!-- GUEST -->

                                    <div class="row g-3">


                                        <div class="col-sm-6">

                                            <small
                                                class="text-secondary">

                                                Guest

                                            </small>

                                            <p class="fw-semibold mb-0">

                                                ${booking.guest}

                                            </p>

                                        </div>



                                        <div class="col-sm-6">

                                            <small
                                                class="text-secondary">

                                                Email

                                            </small>

                                            <p class="fw-semibold mb-0">

                                                ${booking.email}

                                            </p>

                                        </div>



                                        <div class="col-sm-6">

                                            <small
                                                class="text-secondary">

                                                Check-In

                                            </small>

                                            <p class="fw-semibold mb-0">

                                                ${booking.checkIn}

                                            </p>

                                        </div>



                                        <div class="col-sm-6">

                                            <small
                                                class="text-secondary">

                                                Check-Out

                                            </small>

                                            <p class="fw-semibold mb-0">

                                                ${booking.checkOut}

                                            </p>

                                        </div>



                                        <div class="col-sm-6">

                                            <small
                                                class="text-secondary">

                                                Guests

                                            </small>

                                            <p class="fw-semibold mb-0">

                                                ${booking.guests}

                                            </p>

                                        </div>



                                        <div class="col-sm-6">

                                            <small
                                                class="text-secondary">

                                                Rooms

                                            </small>

                                            <p class="fw-semibold mb-0">

                                                ${booking.rooms}

                                            </p>

                                        </div>


                                    </div>



                                    <hr>



                                    <!-- TOTAL -->

                                    <div
                                        class="d-flex
                                               justify-content-between
                                               align-items-center">

                                        <div>

                                            <small
                                                class="text-secondary">

                                                Total Amount

                                            </small>

                                            <h3 class="mb-0">

                                                ₹${Number(
                                                    booking.total
                                                ).toLocaleString(
                                                    "en-IN"
                                                )}

                                            </h3>

                                        </div>


                                        <div>

                                            ⭐ StayFinder

                                        </div>

                                    </div>



                                </div>

                            </div>

                        </div>

                    </div>



                    <!-- BUTTONS -->

                    <div
                        class="text-center mt-4">

                        <a
                            href="hotels.html"
                            class="btn btn-dark me-2">

                            Book Another Hotel

                        </a>


                        <button
                            onclick="printBooking()"
                            class="btn btn-outline-dark">

                            🖨 Print Booking

                        </button>

                    </div>


                </div>

            </div>

        `;



        /* ---------------------------------------------
           GOOGLE ANALYTICS
           --------------------------------------------- */

        trackEvent(
            "my_booking_view",
            {
                hotel_name:
                    booking.hotel,

                booking_value:
                    booking.total
            }
        );

    }
);



/* =====================================================
   PRINT BOOKING
   ===================================================== */

function printBooking() {

    trackEvent(
        "print_booking"
    );

    window.print();

}

</script>

</body>

</html>
