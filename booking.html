<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayFinder | Booking</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7BK6CVH2B3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-7BK6CVH2B3');
</script>
<!-- End Google Analytics -->
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold fs-3" href="index.html">
            <span class="brand-mark">S</span>
            StayFinder
        </a>

        <div>
            <a href="index.html" class="btn btn-outline-dark me-2">Home</a>
            <a href="hotels.html" class="btn btn-dark">Hotels</a>
        </div>

    </div>
</nav>


<div class="container py-5">

    <div class="row g-4">

        <!-- HOTEL DETAILS -->
        <div class="col-lg-5">

            <div class="card border-0 shadow-sm rounded-4">

                <img id="hotelImage"
                     src=""
                     class="card-img-top"
                     style="height:250px;object-fit:cover;">

                <div class="card-body">

                    <h3 id="hotelName"></h3>

                    <p id="hotelLocation" class="text-secondary"></p>

                    <h4>
                        ₹<span id="hotelPrice"></span>
                        <small class="text-secondary">
                            / night
                        </small>
                    </h4>

                    <div class="mt-3">

                        <span class="badge bg-warning text-dark">
                            ⭐ <span id="hotelRating"></span>
                        </span>

                    </div>

                </div>

            </div>

        </div>



        <!-- BOOKING FORM -->
        <div class="col-lg-7">

            <div class="card border-0 shadow-sm rounded-4 p-4">

                <h3 class="mb-4">
                    Complete Your Booking
                </h3>


                <form id="bookingForm">

                    <div class="row g-3">

                        <div class="col-md-6">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="guestName"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                id="guestEmail"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Check-In
                            </label>

                            <input
                                type="date"
                                id="checkIn"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Check-Out
                            </label>

                            <input
                                type="date"
                                id="checkOut"
                                class="form-control"
                                required>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Guests
                            </label>

                            <select
                                id="guests"
                                class="form-select">

                                <option>1</option>
                                <option selected>2</option>
                                <option>3</option>
                                <option>4</option>

                            </select>

                        </div>


                        <div class="col-md-6">

                            <label class="form-label">
                                Rooms
                            </label>

                            <select
                                id="rooms"
                                class="form-select">

                                <option selected>1</option>
                                <option>2</option>
                                <option>3</option>

                            </select>

                        </div>

                    </div>


                    <hr class="my-4">


                    <h5>
                        Estimated Total:
                        ₹<span id="totalPrice">0</span>
                    </h5>


                    <button
                        class="btn btn-dark btn-lg mt-4 w-100"
                        type="submit">

                        Confirm Booking

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Shared JS -->
<script src="script.js"></script>

<script>

let selectedHotel = JSON.parse(
    localStorage.getItem("selectedHotel")
);

if(selectedHotel){

    document.getElementById("hotelImage").src =
        selectedHotel.image;

    document.getElementById("hotelName").innerText =
        selectedHotel.name;

    document.getElementById("hotelLocation").innerText =
        selectedHotel.location;

    document.getElementById("hotelPrice").innerText =
        selectedHotel.price;

    document.getElementById("hotelRating").innerText =
        selectedHotel.rating;
}

function calculateTotal(){

    let price =
        selectedHotel.price;

    let rooms =
        Number(
            document.getElementById("rooms").value
        );

    let total =
        price * rooms;

    document.getElementById(
        "totalPrice"
    ).innerText = total;
}

calculateTotal();

document
.getElementById("rooms")
.addEventListener("change",
    calculateTotal
);


document
.getElementById("bookingForm")
.addEventListener("submit",

function(e){

    e.preventDefault();

    let booking = {

        hotel:
            selectedHotel.name,

        location:
            selectedHotel.location,

        image:
            selectedHotel.image,

        guest:
            document.getElementById(
                "guestName"
            ).value,

        email:
            document.getElementById(
                "guestEmail"
            ).value,

        checkIn:
            document.getElementById(
                "checkIn"
            ).value,

        checkOut:
            document.getElementById(
                "checkOut"
            ).value,

        guests:
            document.getElementById(
                "guests"
            ).value,

        rooms:
            document.getElementById(
                "rooms"
            ).value,

        total:
            document.getElementById(
                "totalPrice"
            ).innerText
    };


    localStorage.setItem(
        "booking",
        JSON.stringify(booking)
    );


    /*
      GOOGLE ANALYTICS EVENT
    */

    trackEvent(
        "booking_complete",
        {
            hotel_name:
                booking.hotel,

            value:
                booking.total
        }
    );


    window.location.href =
        "my-booking.html";

});

</script>

</body>
</html>
